# ═══════════════════════════════════════════════════════════
# InstaServe — Local Development Stack
# ═══════════════════════════════════════════════════════════
# Start:  docker compose up -d
# Stop:   docker compose down
# Reset:  docker compose down -v (deletes data)
# Logs:   docker compose logs -f api
# ═══════════════════════════════════════════════════════════

services:
  # ── PostgreSQL ──
  postgres:
    image: postgres:15-alpine
    container_name: instaserve-postgres
    environment:
      POSTGRES_DB: instaserve
      POSTGRES_USER: instaserve
      POSTGRES_PASSWORD: instaserve_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Migrations are NOT mounted here. Local uses the same migration
      # runner staging/prod do — `cd server && npm run db:migrate` —
      # which tracks applied migrations in schema_migrations and runs
      # idempotently. Postgres's init-script directory only fires on
      # first-boot of an empty volume, so any new migration would
      # silently fail to apply on re-runs without a `down -v` reset.
      # Use `npm run dev:setup` from the repo root for a one-shot
      # bring-up that includes migrations.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instaserve"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: instaserve-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MailHog (SMTP for local email testing) ──
  # Catches all outbound emails so dev doesn't need a real SMTP backend
  # for booking_confirmed and notification emails to render. Browse
  # captured messages at http://localhost:8025.
  # API server uses SMTP_HOST=mailhog SMTP_PORT=1025 to send.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: instaserve-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    restart: unless-stopped

  # ── Image Moderation (NSFW gate for listing photos) ──
  # NudeNet-based FastAPI service; the API server calls it on every
  # listing-image upload when IMAGE_MODERATION_URL is set (see .env).
  # If this container is down the API fails open (uploads allowed) unless
  # IMAGE_MODERATION_FAIL_CLOSED=true.
  image-moderation:
    build:
      context: ./services/image-moderation
      dockerfile: Dockerfile
    container_name: instaserve-image-moderation
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── DynamoDB Local ──
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: instaserve-dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ | grep -q 400"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── DynamoDB Table Init (runs once then exits) ──
  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: instaserve-dynamodb-init
    depends_on:
      dynamodb-local:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ap-south-1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        ENDPOINT="--endpoint-url http://dynamodb-local:8000"

        # audit_events: PK=userId, SK=sortKey, GSI resource-index
        aws dynamodb create-table $$ENDPOINT \
          --table-name instaserve-local-audit-events \
          --attribute-definitions \
            AttributeName=userId,AttributeType=S \
            AttributeName=sortKey,AttributeType=S \
            AttributeName=resourceKey,AttributeType=S \
            AttributeName=timestamp,AttributeType=S \
          --key-schema AttributeName=userId,KeyType=HASH AttributeName=sortKey,KeyType=RANGE \
          --global-secondary-indexes '[{"IndexName":"resource-index","KeySchema":[{"AttributeName":"resourceKey","KeyType":"HASH"},{"AttributeName":"timestamp","KeyType":"RANGE"}],"Projection":{"ProjectionType":"ALL"}}]' \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || true

        # fraud_signals: PK=userId, SK=sortKey, GSI risk-level-index
        aws dynamodb create-table $$ENDPOINT \
          --table-name instaserve-local-fraud-signals \
          --attribute-definitions \
            AttributeName=userId,AttributeType=S \
            AttributeName=sortKey,AttributeType=S \
            AttributeName=riskLevel,AttributeType=S \
            AttributeName=timestamp,AttributeType=S \
          --key-schema AttributeName=userId,KeyType=HASH AttributeName=sortKey,KeyType=RANGE \
          --global-secondary-indexes '[{"IndexName":"risk-level-index","KeySchema":[{"AttributeName":"riskLevel","KeyType":"HASH"},{"AttributeName":"timestamp","KeyType":"RANGE"}],"Projection":{"ProjectionType":"ALL"}}]' \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || true

        # api_request_logs: PK=date, SK=sortKey
        aws dynamodb create-table $$ENDPOINT \
          --table-name instaserve-local-api-request-logs \
          --attribute-definitions \
            AttributeName=date,AttributeType=S \
            AttributeName=sortKey,AttributeType=S \
          --key-schema AttributeName=date,KeyType=HASH AttributeName=sortKey,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || true

        # search_events: PK=userId, SK=sortKey
        aws dynamodb create-table $$ENDPOINT \
          --table-name instaserve-local-search-events \
          --attribute-definitions \
            AttributeName=userId,AttributeType=S \
            AttributeName=sortKey,AttributeType=S \
          --key-schema AttributeName=userId,KeyType=HASH AttributeName=sortKey,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || true

        # analytics_events: PK=userId, SK=sortKey, GSI date-index
        aws dynamodb create-table $$ENDPOINT \
          --table-name instaserve-local-analytics-events \
          --attribute-definitions \
            AttributeName=userId,AttributeType=S \
            AttributeName=sortKey,AttributeType=S \
            AttributeName=date,AttributeType=S \
          --key-schema AttributeName=userId,KeyType=HASH AttributeName=sortKey,KeyType=RANGE \
          --global-secondary-indexes '[{"IndexName":"date-index","KeySchema":[{"AttributeName":"date","KeyType":"HASH"},{"AttributeName":"sortKey","KeyType":"RANGE"}],"Projection":{"ProjectionType":"ALL"}}]' \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || true

        # communication_logs: PK=userId, SK=sortKey
        aws dynamodb create-table $$ENDPOINT \
          --table-name instaserve-local-communication-logs \
          --attribute-definitions \
            AttributeName=userId,AttributeType=S \
            AttributeName=sortKey,AttributeType=S \
          --key-schema AttributeName=userId,KeyType=HASH AttributeName=sortKey,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || true

        # recommendation_signals: PK=userId, SK=sortKey
        aws dynamodb create-table $$ENDPOINT \
          --table-name instaserve-local-recommendation-signals \
          --attribute-definitions \
            AttributeName=userId,AttributeType=S \
            AttributeName=sortKey,AttributeType=S \
          --key-schema AttributeName=userId,KeyType=HASH AttributeName=sortKey,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || true

        echo "All DynamoDB tables created successfully."

  # ── API Server ──
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: instaserve-api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      FRONTEND_URL: http://localhost:8080
      DATABASE_URL: postgres://instaserve:instaserve_dev@postgres:5432/instaserve
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-production
      LOG_LEVEL: debug
      EVENT_PROVIDER: dynamodb
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: ap-south-1
      DYNAMODB_AUDIT_EVENTS_TABLE: instaserve-local-audit-events
      DYNAMODB_FRAUD_SIGNALS_TABLE: instaserve-local-fraud-signals
      DYNAMODB_API_REQUEST_LOGS_TABLE: instaserve-local-api-request-logs
      DYNAMODB_SEARCH_EVENTS_TABLE: instaserve-local-search-events
      DYNAMODB_ANALYTICS_EVENTS_TABLE: instaserve-local-analytics-events
      DYNAMODB_COMMUNICATION_LOGS_TABLE: instaserve-local-communication-logs
      DYNAMODB_RECOMMENDATION_SIGNALS_TABLE: instaserve-local-recommendation-signals
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      dynamodb-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
